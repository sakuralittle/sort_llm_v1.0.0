# ============================================================
#  Apache vhost — 公文分辦 AI 結果頁（獨立 port 8443，零干擾）
# ============================================================
#
#  設計策略：使用獨立 port 8443，完全不碰原有 80 / 443 服務。
#  優點：
#    - 不需要動 XAMPP 預設 vhost（httpd-ssl.conf）
#    - 不會攔截原本走 htdocs 的流量（例如 /alertinfo/）
#    - 同事訪問 URL：https://<中繼主機IP>:8443/
#    - 不需要設 hosts 檔
#
#  部署到新機器：
#    1. 複製本檔到 <XAMPP>/apache/conf/extra/sort-llm.vhost.conf
#    2. 修改下方「Define SORTLLM_HOME」一行為實際安裝路徑
#    3. 在 <XAMPP>/apache/conf/httpd.conf 加入：
#         Include conf/extra/sort-llm.vhost.conf
#       並確保以下模組已啟用（移除前面的 # 即可）：
#         LoadModule ssl_module           modules/mod_ssl.so
#         LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
#         LoadModule headers_module       modules/mod_headers.so
#    4. XAMPP Control Panel → Apache → Stop / Start（一定要 Stop 再 Start，不能只 Restart）
#    5. 防火牆放行 8443（Windows 防火牆 → 輸入規則 → 新增 → TCP 8443 → 允許）
#
#  驗證：
#    curl.exe -k https://localhost:8443/ -I    應回 200 OK
# ============================================================

# ====== 部署到新機器只要改這一行（路徑用正斜線 / 不是反斜線 \）======
Define SORTLLM_HOME "C:/program_dev/sort_llm_v1.0.0/src"
# ====================================================================

# 監聽獨立 port，避免與 80/443 上其他網站衝突
Listen 8443

<VirtualHost *:8443>
    ServerName  sort-llm
    ServerAdmin admin@example.com
    DocumentRoot "${SORTLLM_HOME}/web"

    # ---- SSL 憑證（XAMPP 內建 self-signed，路徑相對 Apache 根目錄）----
    SSLEngine on
    SSLCertificateFile      "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile   "conf/ssl.key/server.key"
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5

    # ---- 對外公開的 web 目錄 ----
    <Directory "${SORTLLM_HOME}/web">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ---- 嚴禁外露：config / lib / data / logs / bin / apache ----
    # 雖然這些目錄都不在 DocumentRoot 之下，正常情況下 URL 無法存取
    # 這裡再加一層 Require all denied 作為「縱深防禦」
    <Directory "${SORTLLM_HOME}/config">
        Require all denied
    </Directory>
    <Directory "${SORTLLM_HOME}/lib">
        Require all denied
    </Directory>
    <Directory "${SORTLLM_HOME}/data">
        Require all denied
    </Directory>
    <Directory "${SORTLLM_HOME}/logs">
        Require all denied
    </Directory>
    <Directory "${SORTLLM_HOME}/bin">
        Require all denied
    </Directory>
    <Directory "${SORTLLM_HOME}/apache">
        Require all denied
    </Directory>

    # ---- 安全標頭（簡易）----
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options        "SAMEORIGIN"
        Header always set Referrer-Policy        "no-referrer-when-downgrade"
    </IfModule>

    ErrorLog  "logs/sort-llm-8443-error.log"
    CustomLog "logs/sort-llm-8443-access.log" common
</VirtualHost>
