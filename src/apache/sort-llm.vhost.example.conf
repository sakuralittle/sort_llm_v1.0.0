# ========================================================
#  Apache vhost 範例 — 公文分辦結果頁
#  把這份複製到 Apache conf/extra/，並在 httpd.conf 加：
#    Include conf/extra/sort-llm.vhost.conf
#  並確保 httpd.conf 啟用：
#    LoadModule rewrite_module modules/mod_rewrite.so
#    Listen 80
# ========================================================

<VirtualHost *:80>
    ServerName  sort-llm.local        # ← 改成中繼主機的內網 hostname 或 IP
    ServerAdmin admin@example.com

    # 注意：把絕對路徑改成你的實際安裝位置
    DocumentRoot "E:/program_dev/sort_llm_v1.0.0/src/web"

    <Directory "E:/program_dev/sort_llm_v1.0.0/src/web">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 嚴禁外露 lib / config / data / logs
    <Directory "E:/program_dev/sort_llm_v1.0.0/src/lib">
        Require all denied
    </Directory>
    <Directory "E:/program_dev/sort_llm_v1.0.0/src/config">
        Require all denied
    </Directory>

    ErrorLog  "logs/sort-llm-error.log"
    CustomLog "logs/sort-llm-access.log" common
</VirtualHost>
