# ============================================================
#  Apache vhost — 公文分辦 AI 結果頁
# ============================================================
#  部署到新機器：
#    1. 複製本檔到 <XAMPP>/apache/conf/extra/sort-llm.vhost.conf
#    2. 修改下方「Define SORTLLM_HOME」一行為實際安裝路徑
#    3. 在 <XAMPP>/apache/conf/httpd.conf 加入：
#         Include conf/extra/sort-llm.vhost.conf
#       並確保以下模組已啟用（移除前面的 # 即可）：
#         LoadModule rewrite_module modules/mod_rewrite.so
#         LoadModule ssl_module     modules/mod_ssl.so
#         LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
#       並確保有以下 Listen：
#         Listen 80
#         Listen 443
#    4. XAMPP Control Panel → Apache → Restart
# ============================================================

# ====== 部署到新機器只要改這一行（路徑用正斜線 / 不是反斜線 \）======
Define SORTLLM_HOME "C:/program_dev/sort_llm_v1.0.0/src"
# ====================================================================

# 路徑檢查（防呆）：DocumentRoot 必須在 src/web 之下
# 其他 src/config, src/lib, src/data, src/logs, src/bin 都在 DocumentRoot 之外
# 從 URL 根本無法存取（多一層 Require all denied 保險）

# ------------------------------------------------------------
# HTTP (80) - 自動跳轉到 HTTPS
# ------------------------------------------------------------
<VirtualHost *:80>
    ServerName  sort-llm.local
    # 如果不要強制 HTTPS，把下面 Redirect 註解掉、改回 DocumentRoot 區塊
    Redirect permanent / https://sort-llm.local/

    ErrorLog  "logs/sort-llm-error.log"
    CustomLog "logs/sort-llm-access.log" common
</VirtualHost>

# ------------------------------------------------------------
# HTTPS (443) - 主入口
# ------------------------------------------------------------
<VirtualHost *:443>
    ServerName  sort-llm.local
    ServerAdmin admin@example.com

    DocumentRoot "${SORTLLM_HOME}/web"

    # ---- SSL 憑證（XAMPP 內建 self-signed，路徑相對 Apache 根目錄）----
    SSLEngine on
    SSLCertificateFile      "conf/ssl.crt/server.crt"
    SSLCertificateKeyFile   "conf/ssl.key/server.key"
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5

    # ---- 對外公開的 web 目錄 ----
    <Directory "${SORTLLM_HOME}/web">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ---- 嚴禁外露：config / lib / data / logs / bin / apache ----
    # 雖然這些目錄都不在 DocumentRoot 之下，正常情況下 URL 無法存取
    # 這裡再加一層 Require all denied 作為「縱深防禦」
    <Directory "${SORTLLM_HOME}/config">  Require all denied </Directory>
    <Directory "${SORTLLM_HOME}/lib">     Require all denied </Directory>
    <Directory "${SORTLLM_HOME}/data">    Require all denied </Directory>
    <Directory "${SORTLLM_HOME}/logs">    Require all denied </Directory>
    <Directory "${SORTLLM_HOME}/bin">     Require all denied </Directory>
    <Directory "${SORTLLM_HOME}/apache">  Require all denied </Directory>

    # ---- 安全標頭（簡易）----
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options        "SAMEORIGIN"
        Header always set Referrer-Policy        "no-referrer-when-downgrade"
    </IfModule>

    ErrorLog  "logs/sort-llm-ssl-error.log"
    CustomLog "logs/sort-llm-ssl-access.log" common
</VirtualHost>
